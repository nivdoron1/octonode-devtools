name: CLI release control panel

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  issue_comment:
    types: [edited]
  workflow_run:
    workflows: [Publish npm packages, Prepare CLI installation packages]
    types: [requested, in_progress, completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: cli-release-panel
  cancel-in-progress: false

jobs:
  panel:
    if: github.repository == 'nivdoron1/octonode-devtools'
    runs-on: ubuntu-24.04
    steps:
      # Metadata only: do not check out the PR head or download workflow artifacts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            await require('./scripts/releases/panel.cjs')({ github, context });
