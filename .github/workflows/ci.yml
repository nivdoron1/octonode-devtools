name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20.19.0", "22.12.0", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn check
      - run: git diff --exit-code -- packages/sdk/src/gen
      - run: yarn test:pack
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run on the supported runtime
        run: node scripts/runtime/test.mjs
      - name: Install and exercise public tarballs with strict engines
        run: npm run test:install

  check:
    needs: runtime
    if: always()
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every supported runtime to pass
        env:
          RESULT: ${{ needs.runtime.result }}
        shell: bash
        run: test "$RESULT" = success
