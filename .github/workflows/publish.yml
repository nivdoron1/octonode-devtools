name: Publish npm packages

on:
  push:
    branches: [main]
    paths:
      - "packages/sdk/**"
      - "packages/cli/**"
      - "package.json"
      - "yarn.lock"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn check
      - run: yarn workspace @octonode/sdk npm publish --access public --provenance --tolerate-republish
      - run: yarn workspace @octonode/cli npm publish --access public --provenance --tolerate-republish
